[project]
name = "marsninja_site"
entry-point = "main.jac"
kind = "web-app"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "blue"
font = "geist"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[serve]
base_route_app = "app"

# Keep the blog a single in-process server: without this, `services/blog.jac`
# being sv-imported from client pages makes `jac start` auto-enter local
# microservice mode (and the nested `services.blog` route can't map to a file).
[scale.microservices]
enabled = false

[dependencies]
markdown = ">=3.5"
Pygments = ">=2.17"

[dependencies.npm]
"@hugeicons/react" = "*"
"@hugeicons/core-free-icons" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/geist" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "marsninja"
description = "Notes on programming languages, AI-native software, and the systems underneath."
author = "marsninja"
theme_color = "#1d4ed8"
icon = "/static/assets/ninjaavatar.png"
